<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>КиберБезопасность 50+</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0f141c;
    color: #f1f5f9;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
    font-size: 18px;
    line-height: 1.6;
  }

  .phone {
    width: 100%;
    max-width: 420px;
    background: #1e2533;
    border-radius: 28px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    border: 1px solid rgba(255, 255, 255, 0.05);
  }

  .status-bar {
    background: rgba(0, 0, 0, 0.15);
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 500;
    color: #94a3b8;
    letter-spacing: 0.5px;
  }

  .header {
    background: #252e41;
    padding: 22px 24px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .header h1 {
    font-size: 24px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -0.3px;
  }

  .header p {
    font-size: 15px;
    color: #94a3b8;
    margin-top: 6px;
    font-weight: 400;
  }

  .screen {
    flex: 1;
    padding: 24px;
    display: none;
    flex-direction: column;
    gap: 20px;
  }

  .screen.active {
    display: flex;
  }

  .progress-wrapper {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 4px;
  }

  .progress {
    display: flex;
    gap: 8px;
    flex: 1;
  }

  .progress-dot {
    flex: 1;
    height: 6px;
    background: #334155;
    border-radius: 4px;
    transition: all 0.3s ease;
  }

  .progress-dot.done {
    background: #10b981;
    box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
  }

  .progress-dot.current {
    background: #3b82f6;
    box-shadow: 0 0 8px rgba(59, 130, 246, 0.5);
  }

  .timer-box {
    background: rgba(239, 68, 68, 0.15);
    color: #ef4444;
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    border: 1px solid rgba(239, 68, 68, 0.3);
    min-width: 54px;
    text-align: center;
    transition: all 0.3s ease;
  }

  .timer-box.warning {
    background: #ef4444;
    color: #ffffff;
    animation: blink 1s infinite;
  }

  @keyframes blink {
    50% { opacity: 0.6; }
  }

  .card {
    background: #252e41;
    border-radius: 18px;
    padding: 20px;
    border: 1px solid rgba(255, 255, 255, 0.05);
  }

  .card.bad {
    border-color: #ef4444;
    background: #2e1a22;
  }

  .card.good {
    border-color: #10b981;
    background: #162e24;
  }

  .scene-icon {
    font-size: 52px;
    text-align: center;
    margin-bottom: 12px;
  }

  .scene-title {
    font-size: 22px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 10px;
    line-height: 1.4;
  }

  .scene-desc {
    font-size: 16px;
    color: #cbd5e1;
    text-align: center;
    margin-bottom: 16px;
    line-height: 1.5;
  }

  .message-bubble {
    background: #151b26;
    border-radius: 16px;
    padding: 16px 18px;
    font-size: 16px;
    line-height: 1.5;
    border-left: 5px solid #3b82f6;
    margin-bottom: 8px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
  }

  .message-bubble.sms {
    border-left-color: #f59e0b;
  }

  .message-bubble.call {
    border-left-color: #ef4444;
  }

  .message-sender {
    font-size: 13px;
    color: #94a3b8;
    margin-bottom: 6px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .btn {
    background: #3b82f6;
    color: #ffffff;
    border: none;
    padding: 18px 24px;
    border-radius: 16px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
    font-family: inherit;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
    line-height: 1.4;
  }

  .btn:active {
    transform: scale(0.98);
  }

  .btn:hover {
    background: #2563eb;
    box-shadow: 0 6px 16px rgba(59, 130, 246, 0.35);
  }

  .btn.danger {
    background: #ef4444;
    box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
  }

  .btn.danger:hover {
    background: #dc2626;
  }

  .btn.success {
    background: #10b981;
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
  }

  .btn.success:hover {
    background: #059669;
  }

  .btn.secondary {
    background: #334155;
    box-shadow: none;
    color: #cbd5e1;
    text-align: left;
    justify-content: flex-start;
  }

  .btn.secondary:hover {
    background: #475569;
  }

  .btn-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: auto;
  }

  .result-icon {
    font-size: 68px;
    text-align: center;
    margin: 12px 0;
  }

  .result-title {
    font-size: 26px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 12px;
  }

  .result-text {
    font-size: 17px;
    color: #cbd5e1;
    text-align: center;
    margin-bottom: 24px;
  }

  .tip-box {
    background: #151b26;
    border-radius: 14px;
    padding: 16px 18px;
    border-left: 5px solid #f59e0b;
  }

  .tip-box .tip-label {
    font-size: 13px;
    color: #f59e0b;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 6px;
  }

  .tip-box p {
    font-size: 15px;
    color: #cbd5e1;
    line-height: 1.5;
  }

  .home-menu {
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-height: 380px;
    overflow-y: auto;
    padding-right: 4px;
  }

  .home-menu::-webkit-scrollbar {
    width: 6px;
  }
  .home-menu::-webkit-scrollbar-thumb {
    background: #334155;
    border-radius: 4px;
  }

  .menu-item {
    background: #252e41;
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 18px;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s, border-color 0.2s;
  }

  .menu-item.completed {
    border-color: rgba(16, 185, 129, 0.3);
    background: #1b2635;
  }

  .menu-item:active {
    transform: scale(0.99);
  }

  .menu-item:hover {
    background: #2e3952;
    border-color: rgba(255, 255, 255, 0.15);
  }

  .menu-icon {
    font-size: 12px;
    font-weight: 800;
    background: rgba(59, 130, 246, 0.15);
    color: #60a5fa;
    padding: 8px 4px;
    border-radius: 10px;
    flex-shrink: 0;
    text-align: center;
    min-width: 68px;
  }

  .menu-item.completed .menu-icon {
    background: rgba(16, 185, 129, 0.15);
    color: #10b981;
  }

  .menu-text {
    flex: 1;
  }

  .menu-text h3 {
    font-size: 17px;
    font-weight: 600;
    color: #ffffff;
    margin-bottom: 4px;
  }

  .menu-text p {
    font-size: 13px;
    color: #94a3b8;
    line-height: 1.4;
  }

  .stats {
    display: flex;
    gap: 14px;
  }

  .stat-box {
    flex: 1;
    background: #252e41;
    border-radius: 16px;
    padding: 14px;
    text-align: center;
    border: 1px solid rgba(255, 255, 255, 0.03);
  }

  .stat-num {
    font-size: 32px;
    font-weight: 800;
    color: #60a5fa;
  }

  .stat-label {
    font-size: 13px;
    color: #94a3b8;
    margin-top: 2px;
    font-weight: 500;
  }

  .back-btn {
    background: transparent;
    border: none;
    color: #94a3b8;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    padding: 4px 0;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: inherit;
    align-self: flex-start;
  }

  .back-btn:hover {
    color: #ffffff;
  }

  .welcome-text {
    font-size: 16px;
    color: #cbd5e1;
    line-height: 1.6;
  }

  .welcome-text strong {
    color: #60a5fa;
    font-weight: 600;
  }

  .final-score {
    text-align: center;
    font-size: 54px;
    font-weight: 800;
    color: #10b981;
    margin: 12px 0;
  }
</style>
</head>
<body>

<div class="phone">
  <div class="status-bar">
    <span>9:41</span>
    <span>Сеть 100%</span>
  </div>

  <div class="header">
    <h1 id="headerTitle">КиберБезопасность</h1>
    <p id="headerSub">Практический тренажёр с таймером</p>
  </div>

  <!-- ЭКРАН 1: ГЛАВНОЕ МЕНЮ -->
  <div class="screen active" id="screen-home">
    <div class="welcome-text">
      Здравствуйте! Пройдите <strong>15 реальных кибератак</strong>. Мошенники будут торопить вас — на каждый ответ у вас есть ровно <strong>20 секунд</strong>!
    </div>
    
    <div class="stats">
      <div class="stat-box">
        <div class="stat-num" id="statScore">0</div>
        <div class="stat-label">Баллов</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="statDone">0/15</div>
        <div class="stat-label">Пройдено</div>
      </div>
    </div>

    <div class="home-menu" id="scenarios-list"></div>
  </div>

  <!-- ЭКРАН 2: ТЕСТИРОВАНИЕ -->
  <div class="screen" id="screen-game">
    <button class="back-btn" onclick="exitToMenu()">← В меню</button>
    <div class="progress-wrapper">
      <div class="progress" id="gameProgress"></div>
      <div class="timer-box" id="gameTimer">20с</div>
    </div>
    <div id="gameContent" style="display: flex; flex-direction: column; gap: 16px; flex: 1;"></div>
  </div>

  <!-- ЭКРАН 3: РЕЗУЛЬТАТ ОТВЕТА -->
  <div class="screen" id="screen-feedback">
    <div id="feedbackContent"></div>
    <div class="btn-group">
      <button class="btn" id="nextBtn" onclick="nextStep()">Далее</button>
    </div>
  </div>

  <!-- ЭКРАН 4: ЗАВЕРШЕНИЕ СЦЕНАРИЯ -->
  <div class="screen" id="screen-result">
    <div class="result-icon">🏆</div>
    <div class="result-title">Сценарий завершен!</div>
    <div class="result-text" id="resultText">Вы успешно прошли тест.</div>
    <div class="final-score" id="resultScore">0/0</div>
    <div class="btn-group">
      <button class="btn" onclick="showHomeScreen()">Вернуться в главное меню</button>
    </div>
  </div>
</div>

<script>
  // БАЗА ДАННЫХ ИЗ 15 СЦЕНАРИЕВ ДЛЯ КАТЕГОРИИ 50+
  const scenarios = [
    {
      id: 0, type: "БАНК", title: "СМС от «банка»", desc: "Подозрительное сообщение о блокировке карты",
      questions: [{
        icon: "✉️", title: "Вам пришло СМС", bubbleType: "sms", sender: "900-BANK",
        message: "Ваша банковская карта заблокирована. Срочно перейдите по ссылке для разблокировки: bank-secure-id82.ru", desc: "Что вы предпримете?",
        answers: [
          { text: "Перейду по ссылке и проверю карту", score: 0, feedback: "Ни в коем случае! Это фишинг. Ссылка ведет на поддельный сайт для кражи денег.", correct: false },
          { text: "Проигнорирую СМС или позвоню по номеру с оборота карты", score: 10, feedback: "Правильно! Банки никогда не шлют ссылки для разблокировок.", correct: true }
        ]
      }]
    },
    {
      id: 1, type: "БЕЗОПАСНОСТЬ", title: "Безопасный счёт", desc: "Звонок специалиста Центробанка о краже средств",
      questions: [{
        icon: "📞", title: "Звонок в мессенджере", bubbleType: "call", sender: "Центробанк РФ",
        message: "«С вашего счета списывают деньги! Срочно переведите все средства на наш безопасный ячейковый счет!»", desc: "Ваша реакция?",
        answers: [
          { text: "Попрошу реквизиты 'безопасного счета'", score: 0, feedback: "Опасно! Понятия 'безопасный счет' не существует, это кошелек мошенников.", correct: false },
          { text: "Сброшу вызов и наберу свой банк вручную", score: 10, feedback: "Отлично! Сотрудники банков никогда не просят переводить деньги куда-либо.", correct: true }
        ]
      }]
    },
    {
      id: 2, type: "ВЫПЛАТЫ", title: "Выплаты пенсионерам", desc: "Сайт с обещанием единовременных компенсаций",
      questions: [{
        icon: "🌐", title: "Ссылка в Одноклассниках", bubbleType: "sms", sender: "Соц-Выплаты",
        message: "«Всем гражданам от 50 лет назначена выплата 25 000 руб. Проверьте паспорт на gosuslugi-compensation.site»", desc: "Как поступите?",
        answers: [
          { text: "Введу данные паспорта и номер карты", score: 0, feedback: "Это копия Госуслуг. Вы отдадите злоумышленникам доступ к профилю и деньгам.", correct: false },
          { text: "Закрою сайт и проверю информацию на официальном сайте СФР", score: 10, feedback: "Верно! Официальные сайты ведомств всегда оканчиваются на .gov.ru.", correct: true }
        ]
      }]
    },
    {
      id: 3, type: "КОД", title: "Случайный код", desc: "Просьба соседки переслать СМС, пришедшее вам",
      questions: [{
        icon: "💬", title: "Сообщение от соседки", bubbleType: "sms", sender: "Мария Соседка",
        message: "«Привет! Я случайно указала твой номер для восстановления. Перешли мне код от Госуслуг, который тебе пришел!»", desc: "Ваши действия?",
        answers: [
          { text: "Отправлю код, ведь мы давно дружим", score: 0, feedback: "Ошибка! Аккаунт соседки взломан. Код — это ключ к вашему личному кабинету.", correct: false },
          { text: "Не отправлю код и перезвоню ей на телефон", score: 10, feedback: "Правильно! Личный звонок быстро подтвердит факт взлома страницы.", correct: true }
        ]
      }]
    },
    {
      id: 4, type: "ГОСУСЛУГИ", title: "Звонок от Госуслуг", desc: "Сообщение техподдержки о взломе профиля",
      questions: [{
        icon: "📱", title: "Вам звонят на телефон", bubbleType: "call", sender: "Портал Госуслуги",
        message: "«Ваш личный кабинет взломан! Чтобы спасти данные, назовите код из СМС, который мы вам отправили».", desc: "Что ответите?",
        answers: [
          { text: "Назову код, чтобы заблокировать взлом", score: 0, feedback: "Критическая ошибка! Техподдержка никогда не запрашивает коды доступа по телефону.", correct: false },
          { text: "Сброшу вызов. Госуслуги никогда не просят коды.", score: 10, feedback: "Великолепно! Это классический способ перехвата аккаунта.", correct: true }
        ]
      }]
    },
    {
      id: 5, type: "ПРИЗ", title: "Выиграш в лотерею", desc: "Сообщение о выигрыше крупного денежного приза",
      questions: [{
        icon: "🎉", title: "Всплывающее окно", bubbleType: "sms", sender: "Гос-Лото-Раффл",

          { text: "Оплачу пошлину, сумма небольшая", score: 0, feedback: "Обман! Вы потеряете и эти деньги, и конфиденциальные данные карты.", correct: false },
          { text: "Закрою страницу. Я не участвовал в лотереях.", score: 10, feedback: "Верно! Требование оплатить что-то для получения приза — маркер мошенников.", correct: true }
        ]
      }]
    },
    {
      id: 6, type: "ЖКХ", title: "Долг за капремонт", desc: "Фальшивая квитанция с требованием закрыть долг по QR",
      questions: [{
        icon: "📄", title: "Квитанция в ящике", bubbleType: "sms", sender: "Учет ЖКХ",

      }]

    {
      id: 7, type: "СВЯЗЬ", title: "Сим-карта истекает", desc: "Звонок якобы от оператора связи о конце договора номера",
      questions: [{

          { text: "Назову код, связь мне необходима", score: 0, feedback: "Обман! У сим-карт нет срока действия. Код нужен им для входа в ваш онлайн-банк.", correct: false },

      }]
    },
    {
      id: 8, type: "ОМС", title: "Замена полиса", desc: "Звонок из страховой компании об обновлении полиса ОМС",
      questions: [{
        icon: "🏥", title: "Звонок в Telegram", bubbleType: "call", sender: "Минздрав / Страховая",

        answers: [
          { text: "Назову код, чтобы не остаться без врачей", score: 0, feedback: "Ловушка! Полис ОМС в РФ бессрочный. Звонят мошенники для взлома Госуслуг.", correct: false },

        ]
      }]
    },
    {
      id: 9, type: "ПЕНСИЯ", title: "Перерасчёт стажа", desc: "Звонок от Социального фонда с предложением надбавки",
      questions: [{
        icon: "💰", title: "Звонок на телефон", bubbleType: "call", sender: "Соц-Фонд РФ",

        answers: [

    {

    {

        icon: "🛡️", title: "Системный чат", bubbleType: "sms", sender: "Служба Безопасности",

        answers: [
          { text: "Перейду и введу проверочный код", score: 0, feedback: "Вы отдадите аккаунт. Мошенники займут деньги у всех ваших друзей от вашего имени.", correct: false },
          { text: "Проигнорирую чат. Администрация не рассылает такие ссылки.", score: 10, feedback: "Правильно! Это стандартный угон аккаунтов через фишинг.", correct: true }
        ]
      }]
    }
  ];

  let totalScore = 0;
  let completedScenariosCount = 0;
  let currentScenario = null;
  let currentQuestionIndex = 0;
  let completedScenariosIds = [];
  
  // Переменные для таймера
  let timerInterval = null;
  let timeLeft = 20;

  function init() {
    renderMenu();
    updateStatsCounters();
  }

  function renderMenu() {
    const menuContainer = document.getElementById("scenarios-list");
    menuContainer.innerHTML = "";

    scenarios.forEach(scen => {
      const isCompleted = completedScenariosIds.includes(scen.id);
      const item = document.createElement("div");
      item.className = `menu-item ${isCompleted ? 'completed' : ''}`;
      item.onclick = () => startScenario(scen.id);

      item.innerHTML = `
        <div class="menu-icon">${scen.type}</div>
        <div class="menu-text">
          <h3>${scen.title}</h3>
          <p>${scen.desc}</p>
        </div>
      `;
      menuContainer.appendChild(item);
    });
  }

  function updateStatsCounters() {
    document.getElementById("statScore").innerText = totalScore;
    document.getElementById("statDone").innerText = `${completedScenariosCount}/${scenarios.length}`;
  }

  function switchScreen(screenId) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById(screenId).classList.add("active");
  }

  function showHomeScreen() {
    clearInterval(timerInterval);
    renderMenu();
    updateStatsCounters();
    switchScreen("screen-home");
  }

  function startScenario(id) {
    currentScenario = scenarios.find(s => s.id === id);
    currentQuestionIndex = 0;
    renderQuestion();
    switchScreen("screen-game");
  }

  function renderQuestion() {
    const question = currentScenario.questions[currentQuestionIndex];
    const progressContainer = document.getElementById("gameProgress");
    progressContainer.innerHTML = "";
    
    currentScenario.questions.forEach((q, idx) => {
      const dot = document.createElement("div");
      dot.className = "progress-dot";
      if (idx < currentQuestionIndex) dot.className += " done";
      if (idx === currentQuestionIndex) dot.className += " current";
      progressContainer.appendChild(dot);
    });

    const contentContainer = document.getElementById("gameContent");
    let btnGroupHtml = `<div class="btn-group">`;
    question.answers.forEach((ans, index) => {
      btnGroupHtml += `<button class="btn secondary" onclick="selectAnswer(${index})">${ans.text}</button>`;
    });
    btnGroupHtml += `</div>`;

    contentContainer.innerHTML = `
      <div style="flex: 1; display: flex; flex-direction: column; gap: 12px;">
        <div class="scene-icon">${question.icon}</div>
        <div class="scene-title">${question.title}</div>
        <div class="message-bubble ${question.bubbleType}">
          <div class="message-sender">${question.sender}</div>
          <div>${question.message}</div>
        </div>
        <div class="scene-desc" style="font-weight:600; color:#fff; text-align: left; margin-top: 4px;">${question.desc}</div>
      </div>
      ${btnGroupHtml}
    `;

    // Запуск таймера на 20 секунд
    startCountdown();
  }

  function startCountdown() {
    clearInterval(timerInterval);
    timeLeft = 20;
    const timerBox = document.getElementById("gameTimer");
    timerBox.innerText = `${timeLeft}с`;
    timerBox.classList.remove("warning");

    timerInterval = setInterval(() => {
      timeLeft--;
      timerBox.innerText = `${timeLeft}с`;

      if (timeLeft <= 5) {
        timerBox.classList.add("warning");
      }

      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        handleTimeout();
      }
    }, 1000);
  }

  function handleTimeout() {
    // Вызывается, если время истекло
    const feedbackContainer = document.getElementById("feedbackContent");
    feedbackContainer.innerHTML = `
      <div class="card bad">
        <div class="scene-icon">⏰</div>
        <div class="scene-title">Время истекло!</div>
        <div class="scene-desc" style="text-align:left; margin-bottom:0; color:#fff;">
          Мошенники манипулировали вами с помощью спешки, и вы не успели сориентироваться. В реальной жизни это привело бы к потере контроля над ситуацией.
        </div>
      </div>
      <div class="tip-box" style="margin-top: 15px;">
        <div class="tip-label">💡 Совет кибербезопасности</div>
        <p>Искусственная спешка и запугивание судом/штрафами — главный инструмент злоумышленников. Всегда берите паузу на размышление, несмотря на их давление.</p>
      </div>
    `;
    switchScreen("screen-feedback");
  }

  function selectAnswer(ansIndex) {
    clearInterval(timerInterval);
    const question = currentScenario.questions[currentQuestionIndex];
    const answer = question.answers[ansIndex];
    totalScore += answer.score;

    const feedbackContainer = document.getElementById("feedbackContent");
    feedbackContainer.innerHTML = `
      <div class="card ${answer.correct ? 'good' : 'bad'}">
        <div class="scene-icon">${answer.correct ? '✅' : '❌'}</div>
        <div class="scene-title">${answer.correct ? 'Правильно!' : 'Опасно! Это ловушка'}</div>
        <div class="scene-desc" style="text-align:left; margin-bottom:0; color:#fff;">${answer.feedback}</div>
      </div>
      <div class="tip-box" style="margin-top: 15px;">
        <div class="tip-label">💡 Совет кибербезопасности</div>
        <p>Никогда не поддавайтесь панике. Лучше положить трубку, закрыть вкладку браузера и самостоятельно связаться со службой поддержки через проверенный номер.</p>
      </div>
    `;

    switchScreen("screen-feedback");
  }

  function nextStep() {
    currentQuestionIndex++;
    
    if (currentQuestionIndex < currentScenario.questions.length) {
      renderQuestion();
      switchScreen("screen-game");
    } else {
      if (!completedScenariosIds.includes(currentScenario.id)) {
        completedScenariosIds.push(currentScenario.id);
        completedScenariosCount++;
      }
      let maxScenScore = currentScenario.questions.length * 10;
      
      document.getElementById("resultText").innerHTML = `Вы успешно разобрали ситуацию: <br><strong>«${currentScenario.title}»</strong>.`;
      document.getElementById("resultScore").innerText = `+${maxScenScore} Баллов`;
      
      switchScreen("screen-result");
    }
  }

  function exitToMenu() {
    clearInterval(timerInterval);
    showHomeScreen();
  }

  window.onload = init;
</script>
